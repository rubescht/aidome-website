<!--
  AI Dome — "Start AI discovery" questionnaire
  Handover build for the Rendr development team.

  • Single file: markup, styles and logic are all here; no framework or build step needed.
  • Flow: intro → 8 sections → results (readiness score, package, first agents, priorities, training).
  • All questions live in STEPS; scoring/recommendation logic lives in results().
  • Wire the backend in submitAnswers() (CRM / email / webhook). It currently only logs to the console.
  • Links marked data-link="website" point back to the main site — set WEBSITE_URL below.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#160F19; --bg-deep:#110C16; --panel:#241C38; --panel-accent:#2E1A34;
  --line:#3A3158; --line-soft:#2C2442; --line-strong:#554A7A;
  --text:#F4F0FA; --text-soft:#C9C3DF; --text-mute:#B4ACCB; --text-faint:#A8A1C2;
  --white:#FFFFFF; --magenta:#B83C90; --pink:#F2A6D8; --violet-soft:#8FA2FF;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--pink)} a:hover{color:var(--white)}
.wrap{max-width:880px;margin:0 auto;padding:0 clamp(20px,5vw,24px);width:100%}
header{border-bottom:1px solid var(--line-soft)}
header .wrap{padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
header img{height:40px;width:auto;display:block}
header .back{color:#D6D0EA;text-decoration:none;font-size:15px}
main{flex:1} main .wrap{padding-top:clamp(32px,6vw,48px);padding-bottom:clamp(56px,9vw,96px)}
section{display:flex;flex-direction:column;gap:28px}
.eyebrow{margin:0 0 14px;font-family:var(--display);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);font-weight:600}
h1{margin:0;font-family:var(--display);color:var(--white);letter-spacing:-.02em}
h1.hero{font-size:clamp(36px,5vw,56px);line-height:1.06;font-weight:700;margin-bottom:18px}
h1.step{font-size:clamp(30px,4vw,42px);line-height:1.1;margin-bottom:8px;letter-spacing:0}
h1.results{font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin-bottom:12px;letter-spacing:0}
h2{margin:0;font-family:var(--display);color:var(--white)}
.lead{margin:0;font-size:19px;color:var(--text-soft);max-width:640px}
.soft{margin:0;color:var(--text-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.tile-big{font-family:var(--display);font-size:28px;font-weight:700;color:var(--white)}
.tile-sub{margin:4px 0 0;color:var(--text-soft);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border-radius:10px;font:inherit;cursor:pointer;min-height:48px;padding:14px 28px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-primary{background:var(--magenta);color:var(--white);border:0}
.btn-primary:hover{background:#C94A9F;color:var(--white)}
.btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--text);font-weight:500;padding:14px 24px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.small{font-size:14px;color:var(--text-faint)}
.tiny{margin:0;font-size:13px;color:var(--text-faint)}
.progress-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--text-mute)}
.segs{display:grid;gap:6px}
.seg{height:6px;border-radius:3px;background:var(--line)} .seg.on{background:var(--magenta)}
.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:30px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend,label.q{padding:0;margin-bottom:4px;font-weight:600;color:var(--white);font-size:17px}
.hint{font-size:14px;color:var(--text-mute)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:transparent;border:1px solid var(--line-strong);color:#E6E1F2;border-radius:999px;padding:10px 18px;font:inherit;font-size:15.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:var(--white);font-weight:600}
.field{display:flex;flex-direction:column;gap:10px}
input,textarea{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;color:var(--text);padding:12px 14px;font:inherit;min-height:48px;width:100%}
textarea{resize:vertical}
.alert{margin:0;padding:14px 18px;border-radius:10px;background:#3A1638;border:1px solid #E05AAE;color:var(--white)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px}
.score-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;display:flex;flex-wrap:wrap;gap:28px 48px;align-items:center}
.label-caps{font-size:14px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.score{font-family:var(--display);font-size:72px;font-weight:700;color:var(--white);line-height:1}
.score span{font-size:28px;color:var(--text-faint)}
.level{font-family:var(--display);font-size:22px;font-weight:600;color:var(--pink)}
.scoresegs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.scoresegs .seg{height:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:10px}
.box.accent{background:var(--panel-accent);border-color:var(--magenta)}
.box .cap{font-size:13px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.box.accent .cap{color:var(--pink)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.agent{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.agent strong{color:var(--white);font-family:var(--display);font-size:18px}
.agent span{color:var(--text-soft);font-size:15px}
ol.pri{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;color:#E6E1F2}
.cta{border:1px solid var(--line-strong);border-radius:16px;padding:28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
footer{border-top:1px solid var(--line-soft);background:var(--bg-deep)}
footer .wrap{padding-top:24px;padding-bottom:24px;font-size:13px;color:var(--text-faint)} footer a{color:var(--text-faint)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- Mobile version (one question per screen) ---------- */
.m-top{display:flex;flex-direction:column;gap:10px}
.m-meta{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--text-mute)}
.m-track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.m-track i{display:block;height:100%;background:linear-gradient(90deg,#7C6CF2,var(--magenta));border-radius:3px}
.m-sec{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:600;margin:6px 0 0}
.m-q{font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.15;color:var(--white);margin:0}
.m-hint{font-size:15px;color:var(--text-mute);margin:-10px 0 0}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line-strong);color:#E6E1F2;border-radius:14px;padding:14px 16px;min-height:56px;font:inherit;font-size:17px;cursor:pointer}
.opt .mk{flex:0 0 24px;height:24px;border:2px solid var(--line-strong);border-radius:50%;display:grid;place-items:center}
.opt.multi .mk{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--magenta);background:#2E1A34;color:var(--white);font-weight:600}
.opt[aria-pressed="true"] .mk{background:var(--magenta);border-color:var(--magenta)}
.m-field input,.m-field textarea{font-size:18px;min-height:56px;border-radius:12px}
.m-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px clamp(20px,5vw,24px) calc(12px + env(safe-area-inset-bottom));background:rgba(22,15,25,.96);border-top:1px solid var(--line-soft);display:flex;gap:10px;backdrop-filter:blur(6px)}
.m-bar .btn{flex:1 1 0;min-height:54px;padding:12px 10px}
.m-bar .btn-ghost{flex:0 0 34%}
.m-dots{display:flex;gap:6px;justify-content:center}
.m-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.m-dots i.on{background:var(--pink)}
body.is-mobile.in-q main .wrap{padding-bottom:110px}
body.is-mobile.in-q footer{display:none}
body.is-mobile .tiles{grid-template-columns:1fr}
body.is-mobile .row .btn{flex:1 1 100%}
body.is-mobile header img{height:34px}

@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<script>
var WEBSITE_URL = 'index.html';   // main website (used by "Back to website")
var DISCOVERY_ENDPOINT = '';      // Rendr: set to your form handler URL (POST JSON). Empty = console only.
var PHONE = '1300 737 562', PHONE_TEL = 'tel:1300737562';

/* ---------- Questionnaire content ---------- */
var STEPS = [
  { title: 'Your business', blurb: 'A little context so we can tailor our advice.', qs: [
    { id: 'company', label: 'Business name', type: 'text', ac: 'organization' },
    { id: 'industry', label: 'Industry', type: 'single', opts: ['Professional services', 'Health & aged care', 'Construction & trades', 'Hospitality & tourism', 'Retail & e-commerce', 'Manufacturing & logistics', 'Finance & insurance', 'Education', 'Not-for-profit', 'Other'] },
    { id: 'staff', label: 'How many staff do you have?', type: 'single', opts: ['1–19', '20–49', '50–199', '200+'] },
    { id: 'role', label: 'Your role', type: 'single', opts: ['Owner / CEO', 'Executive or manager', 'IT', 'Operations', 'Other'] }
  ]},
  { title: 'AI in your business today', blurb: 'There are no wrong answers — most businesses are just getting started.', qs: [
    { id: 'stage', label: 'Which best describes your AI use today?', type: 'single', opts: ['Not started', 'Experimenting', 'Using some AI tools', 'AI built into how we work'] },
    { id: 'tools', label: 'Which AI tools do your people use?', hint: 'Select all that apply', type: 'multi', opts: ['ChatGPT', 'Microsoft Copilot', 'Google Gemini', 'Claude', 'AI inside other apps', 'None', 'Not sure'] },
    { id: 'shadow', label: 'Are staff using AI tools the business hasn’t approved?', type: 'single', opts: ['Yes', 'No', 'Not sure'] },
    { id: 'policy', label: 'Do you have an AI use policy?', type: 'single', opts: ['Yes', 'In draft', 'No'] }
  ]},
  { title: 'Goals & time-wasters', blurb: 'This tells us where AI agents will give your people the most time back.', qs: [
    { id: 'goals', label: 'What do you most want AI to do for you?', hint: 'Pick up to three', type: 'multi', max: 3, opts: ['Give staff time back', 'Faster customer service', 'Grow sales', 'Better reporting & insights', 'Fewer errors', 'Upskill our people'] },
    { id: 'timeloss', label: 'Where does your team lose the most time?', hint: 'Select all that apply', type: 'multi', opts: ['Email & admin', 'Data entry between systems', 'Quotes & proposals', 'Customer enquiries', 'Reports & dashboards', 'Scheduling & rostering', 'Invoices & accounts', 'Finding information'] },
    { id: 'pain', label: 'Describe your biggest time-waster in a sentence or two', type: 'area' }
  ]},
  { title: 'Systems & data', blurb: 'So we know what your agents need to connect to — and what must be protected.', qs: [
    { id: 'systems', label: 'Which systems does your business use?', hint: 'Select all that apply', type: 'multi', opts: ['Microsoft 365', 'Google Workspace', 'Xero', 'MYOB', 'HubSpot', 'Salesforce', 'Industry or job management software', 'Other'] },
    { id: 'data', label: 'What sensitive information do you handle?', hint: 'Select all that apply', type: 'multi', opts: ['Customer personal information', 'Health information', 'Financial records', 'Contracts & IP', 'Employee records', 'None of these'] },
    { id: 'obligations', label: 'Which obligations apply to you?', hint: 'Select all that apply', type: 'multi', opts: ['Privacy Act', 'Industry regulator', 'ISO 27001', 'Essential Eight', 'Government contracts', 'Not sure'] }
  ]},
  { title: 'People & training', blurb: 'Training is the biggest part of every AI Dome program.', qs: [
    { id: 'confidence', label: 'How confident are your people using AI today?', hint: '1 = not at all, 5 = very confident', type: 'single', opts: ['1', '2', '3', '4', '5'] },
    { id: 'train', label: 'Who needs training first?', hint: 'Select all that apply', type: 'multi', opts: ['Leadership team', 'All staff', 'Customer-facing teams', 'Admin & finance', 'IT team'] },
    { id: 'champion', label: 'Could someone in your team be an AI Champion?', type: 'single', opts: ['Yes', 'Maybe', 'No'] }
  ]},
  { title: 'Security & governance', blurb: 'Strikeforce Cyber builds the guardrails around everything we deliver.', qs: [
    { id: 'cyber', label: 'Who looks after your cyber security?', type: 'single', opts: ['Strikeforce Cyber / Code Black Group', 'Another provider', 'In-house team', 'No one formally'] },
    { id: 'mfa', label: 'Is multi-factor authentication on for all staff?', type: 'single', opts: ['Yes', 'Partly', 'No', 'Not sure'] },
    { id: 'concerns', label: 'What worries you most about AI?', hint: 'Select all that apply', type: 'multi', opts: ['Data leaking out', 'Inaccurate answers', 'Staff misuse', 'Regulation & compliance', 'Cost', 'Impact on jobs'] }
  ]},
  { title: 'Timing & investment', blurb: 'Helps us shape a plan that fits your timeline and budget.', qs: [
    { id: 'timing', label: 'When would you like to start?', type: 'single', opts: ['As soon as possible', 'In 1–3 months', 'In 3–6 months', 'Just exploring'] },
    { id: 'budget', label: 'What budget range are you considering?', type: 'single', opts: ['Under A$20k', 'A$20k–50k', 'A$50k–120k', 'A$120k+', 'Not sure yet'] },
    { id: 'plan', label: 'Would a payment plan help spread the cost?', type: 'single', opts: ['Yes', 'Maybe', 'No'] },
    { id: 'existing', label: 'Are you an existing Code Black Group client?', hint: 'Midnight IT, Strikeforce Cyber, Wize, Rendr or 3 Eyes Australia', type: 'single', opts: ['Yes', 'No'] }
  ]},
  { title: 'Your details', blurb: 'Where should we send your results?', qs: [
    { id: 'name', label: 'Full name', type: 'text', ac: 'name' },
    { id: 'email', label: 'Work email', type: 'text', inputType: 'email', ac: 'email' },
    { id: 'phone', label: 'Phone', type: 'text', inputType: 'tel', ac: 'tel' },
    { id: 'contactTime', label: 'Best time to contact you', type: 'single', opts: ['Morning', 'Afternoon', 'Any time'] },
    { id: 'consent', label: 'Consent', type: 'single', opts: ['I agree to AI Dome contacting me about my results'] }
  ]}
];

var AGENTS = {
  'Email & admin': ['Inbox & admin assistant', 'Triages email, drafts replies and chases follow-ups.'],
  'Data entry between systems': ['Operations agent', 'Moves data between your systems so nobody retypes it.'],
  'Quotes & proposals': ['Sales & CRM agent', 'Drafts quotes and proposals and keeps your CRM current.'],
  'Customer enquiries': ['Customer service agent', 'Answers common questions 24/7 from your own knowledge.'],
  'Reports & dashboards': ['Reporting agent', 'Builds weekly reports with a plain-English summary.'],
  'Scheduling & rostering': ['Scheduling agent', 'Handles rosters, bookings and reminders.'],
  'Invoices & accounts': ['Finance & accounts agent', 'Codes bills, matches invoices and chases overdue accounts.'],
  'Finding information': ['Knowledge agent', 'Lets staff ask questions of your policies and past work.']
};

var PKG = {
  Foundation: 'Discovery, AI policy, approved tools and AI register, plus AI Essentials and Safe & secure AI training for your team.',
  Growth: 'Everything in Foundation, plus the full governance framework, up to two custom AI agents, leadership workshops, AI Champions and six months of optimisation.',
  Enterprise: 'Everything in Growth, plus board reporting, up to five custom AI agents and twelve months of optimisation and learning.'
};

/* ---------- Backend hook (Rendr: connect this) ---------- */
function submitAnswers(payload) {
  if (!DISCOVERY_ENDPOINT) { console.log('AI Discovery submission (no endpoint set)', payload); return; }
  fetch(DISCOVERY_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) }).catch(function () {});
}

/* ---------- State ---------- */
var state = { step: 0, qi: 0, a: {}, err: '' };
/* Two versions: DESKTOP (one section per screen) and MOBILE (one question per screen, sticky buttons).
   Chosen automatically by screen width; force one with ?view=mobile or ?view=desktop. */
var VIEW = (location.search.match(/[?&]view=(mobile|desktop)/) || [])[1] || '';
var MQ = window.matchMedia ? window.matchMedia('(max-width: 640px)') : null;
function isMobile() { return VIEW ? VIEW === 'mobile' : !!(MQ && MQ.matches); }
var CHECK = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
var BOT = '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8FA2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setA(id, v) { state.a[id] = v; state.err = ''; }
function go(n, qi) { state.step = n; state.qi = qi || 0; state.err = ''; render(); try { window.scrollTo(0, 0); } catch (e) {} }

function toggle(q, o) {
  var cur = (state.a[q.id] || []).slice(), i = cur.indexOf(o);
  if (i >= 0) cur.splice(i, 1);
  else { if (q.max && cur.length >= q.max) return; cur.push(o); }
  setA(q.id, cur);
}

function submit() {
  var a = state.a;
  if (!a.name || !a.email || !a.consent) {
    state.err = 'Please add your name, work email and consent so we can send your results.';
    if (isMobile()) { var qs = STEPS[STEPS.length - 1].qs; for (var i = 0; i < qs.length; i++) { if (['name', 'email', 'consent'].indexOf(qs[i].id) >= 0 && !a[qs[i].id]) { state.step = STEPS.length; state.qi = i; break; } } }
    render(); return;
  }
  var r = results();
  submitAnswers({ answers: a, results: { score: r.score, level: r.level, package: r.pkg, agents: r.agents.map(function (g) { return g.name; }), priorities: r.priorities, training: r.trainTitle }, submittedAt: new Date().toISOString() });
  go(9);
}

/* ---------- Scoring & recommendations ---------- */
function results() {
  var a = state.a;
  var stagePts = { 'Not started': 5, 'Experimenting': 12, 'Using some AI tools': 20, 'AI built into how we work': 28 };
  var policyPts = { 'Yes': 20, 'In draft': 10, 'No': 0 };
  var shadowPts = { 'No': 10, 'Not sure': 3, 'Yes': 0 };
  var cyberPts = { 'Strikeforce Cyber / Code Black Group': 15, 'Another provider': 12, 'In-house team': 10, 'No one formally': 0 };
  var mfaPts = { 'Yes': 10, 'Partly': 5, 'No': 0, 'Not sure': 2 };
  var conf = parseInt(a.confidence || '0', 10) || 0;
  var score = (stagePts[a.stage] || 0) + (policyPts[a.policy] || 0) + (shadowPts[a.shadow] || 0) + (cyberPts[a.cyber] || 0) + (mfaPts[a.mfa] || 0) + conf * 3 + (a.champion === 'Yes' ? 2 : 0);
  score = Math.max(0, Math.min(100, score));
  var level, levelText;
  if (score < 40) { level = 'Getting started'; levelText = 'Build the foundations first: a clear AI policy, approved tools and staff training before connecting AI to your systems.'; }
  else if (score < 70) { level = 'Building'; levelText = 'You have the basics in place and are ready for your first governed AI agents.'; }
  else { level = 'Ready to scale'; levelText = 'Strong foundations. Focus on agents that give back the most time and scale what is already working.'; }

  var pkg = 'Growth';
  if (a.staff === '1–19') pkg = 'Foundation';
  if (a.staff === '200+') pkg = 'Enterprise';
  if (a.budget === 'Under A$20k') pkg = 'Foundation';
  if (a.budget === 'A$120k+') pkg = 'Enterprise';

  var agents = [], seen = {};
  (a.timeloss || []).concat(['Email & admin', 'Finding information', 'Customer enquiries']).forEach(function (t) {
    var g = AGENTS[t];
    if (g && !seen[g[0]] && agents.length < 3) { seen[g[0]] = true; agents.push({ name: g[0], desc: g[1] }); }
  });

  var pr = [], d = a.data || [];
  if (a.shadow === 'Yes' || a.shadow === 'Not sure') pr.push('Run a shadow AI discovery to see which AI tools staff already use.');
  if (a.policy !== 'Yes') pr.push('Put an AI acceptable use policy and approved-tools list in place.');
  if (d.indexOf('Customer personal information') >= 0 || d.indexOf('Health information') >= 0) pr.push('Classify sensitive data and prepare for the Privacy Act transparency rules from 10 December 2026.');
  if (a.mfa && a.mfa !== 'Yes') pr.push('Turn on multi-factor authentication for everyone before connecting AI to your systems.');
  if (a.cyber === 'No one formally') pr.push('Put 24/7 security monitoring and AI guardrails around your AI tools with Strikeforce Cyber.');
  if (pr.length < 2) pr.push('Set up an AI register so every tool and agent in use is recorded and owned.');
  if (pr.length < 3) pr.push('Add human approval points for anything AI sends, pays, deletes or publishes.');

  var trainTitle, trainText;
  if (conf && conf <= 2) { trainTitle = 'AI Essentials for everyone'; trainText = 'Start with hands-on AI Essentials and Safe & secure AI for all staff, then AI Leadership for your managers.'; }
  else if (conf >= 4) { trainTitle = 'AI Champions'; trainText = 'Your people are ready: AI Champions masterclasses will spread what works across every team.'; }
  else { trainTitle = 'AI Leadership + Essentials'; trainText = 'Leadership workshops to set direction, plus role-based AI Essentials for your priority teams.'; }

  var first = (a.name || '').trim().split(' ')[0];
  return { score: score, level: level, levelText: levelText, pkg: pkg, pkgDesc: PKG[pkg], agents: agents, priorities: pr.slice(0, 4), trainTitle: trainTitle, trainText: trainText, greeting: first ? ', ' + first : '' };
}

/* ---------- Views ---------- */
function viewIntro() {
  return '<section>' +
    '<div><p class="eyebrow">AI Discovery</p>' +
    '<h1 class="hero">Find the best place to start with AI.</h1>' +
    '<p class="lead">Answer eight short sections about your business, your people and your systems. You’ll get a tailored AI starting point straight away, and our team will follow up with a free discovery session.</p></div>' +
    '<div class="tiles">' +
      '<div class="card"><div class="tile-big">8 minutes</div><p class="tile-sub">Mostly tap-to-answer questions</p></div>' +
      '<div class="card"><div class="tile-big">Instant results</div><p class="tile-sub">Readiness score, first agents and priorities</p></div>' +
      '<div class="card"><div class="tile-big">No obligation</div><p class="tile-sub">Your answers stay confidential</p></div>' +
    '</div>' +
    '<div class="row"><button type="button" class="btn btn-primary" data-act="start">Start the questionnaire</button>' +
    '<span class="small">Prefer to talk? Call <a href="' + PHONE_TEL + '">' + PHONE + '</a></span></div>' +
  '</section>';
}

function viewStep(n) {
  var cur = STEPS[n - 1], a = state.a, segs = '';
  for (var i = 1; i <= STEPS.length; i++) segs += '<div class="seg' + (i <= n ? ' on' : '') + '"></div>';
  var qs = cur.qs.map(function (q, qi) {
    var key = n + ':' + qi;
    if (q.type === 'single' || q.type === 'multi') {
      var opts = q.opts.map(function (o, oi) {
        var on = q.type === 'multi' ? (a[q.id] || []).indexOf(o) >= 0 : a[q.id] === o;
        return '<button type="button" class="chip" aria-pressed="' + on + '" data-act="pick" data-q="' + key + '" data-o="' + oi + '">' + (on ? CHECK : '') + esc(o) + '</button>';
      }).join('');
      return '<fieldset><legend>' + esc(q.label) + '</legend>' + (q.hint ? '<span class="hint">' + esc(q.hint) + '</span>' : '') + '<div class="chips">' + opts + '</div></fieldset>';
    }
    var id = 'q-' + q.id;
    if (q.type === 'area') return '<div class="field"><label class="q" for="' + id + '">' + esc(q.label) + '</label><textarea id="' + id + '" rows="4" data-id="' + q.id + '">' + esc(a[q.id] || '') + '</textarea></div>';
    return '<div class="field"><label class="q" for="' + id + '">' + esc(q.label) + '</label><input id="' + id + '" type="' + (q.inputType || 'text') + '" autocomplete="' + (q.ac || 'off') + '" value="' + esc(a[q.id] || '') + '" data-id="' + q.id + '"></div>';
  }).join('');
  var last = n === STEPS.length;
  return '<section>' +
    '<div style="display:flex;flex-direction:column;gap:12px"><div class="progress-meta"><span>Section ' + n + ' of ' + STEPS.length + '</span><span>' + esc(cur.title) + '</span></div>' +
    '<div class="segs" aria-hidden="true" style="grid-template-columns:repeat(' + STEPS.length + ',minmax(0,1fr))">' + segs + '</div></div>' +
    '<div><h1 class="step">' + esc(cur.title) + '</h1><p class="soft">' + esc(cur.blurb) + '</p></div>' +
    '<div class="qpanel">' + qs + '</div>' +
    (state.err ? '<p role="alert" class="alert">' + esc(state.err) + '</p>' : '') +
    '<div class="nav"><button type="button" class="btn btn-ghost" data-act="back">Back</button>' +
    (last ? '<button type="button" class="btn btn-primary" data-act="submit">See my AI starting point</button>' : '<button type="button" class="btn btn-primary" data-act="next">Next section</button>') + '</div>' +
    '<p class="tiny">Your answers are used only to prepare your AI recommendations and are handled under the AI Dome privacy policy.</p>' +
  '</section>';
}


function totalQs() { return STEPS.reduce(function (t, s) { return t + s.qs.length; }, 0); }
function doneBefore(n, qi) { var c = 0; for (var i = 0; i < n - 1; i++) c += STEPS[i].qs.length; return c + qi; }
function viewStepMobile(n) {
  var cur = STEPS[n - 1], qi = Math.min(state.qi, cur.qs.length - 1), q = cur.qs[qi], a = state.a, key = n + ':' + qi;
  var pos = doneBefore(n, qi) + 1, tot = totalQs(), body = '';
  if (q.type === 'single' || q.type === 'multi') {
    body = '<div class="opt-list" role="group" aria-label="' + esc(q.label) + '">' + q.opts.map(function (o, oi) {
      var on = q.type === 'multi' ? (a[q.id] || []).indexOf(o) >= 0 : a[q.id] === o;
      return '<button type="button" class="opt ' + q.type + '" aria-pressed="' + on + '" data-act="pick" data-q="' + key + '" data-o="' + oi + '"><span class="mk">' + (on ? CHECK : '') + '</span>' + esc(o) + '</button>';
    }).join('') + '</div>';
  } else {
    var id = 'q-' + q.id;
    body = '<div class="field m-field"><label class="sr" for="' + id + '">' + esc(q.label) + '</label>' + (q.type === 'area'
      ? '<textarea id="' + id + '" rows="5" data-id="' + q.id + '">' + esc(a[q.id] || '') + '</textarea>'
      : '<input id="' + id + '" type="' + (q.inputType || 'text') + '" autocomplete="' + (q.ac || 'off') + '" value="' + esc(a[q.id] || '') + '" data-id="' + q.id + '">') + '</div>';
  }
  var dots = ''; for (var i = 0; i < cur.qs.length; i++) dots += '<i class="' + (i <= qi ? 'on' : '') + '"></i>';
  var last = n === STEPS.length && qi === cur.qs.length - 1;
  return '<section style="gap:22px">' +
    '<div class="m-top"><div class="m-meta"><span>Section ' + n + ' of ' + STEPS.length + '</span><span>' + pos + ' / ' + tot + '</span></div>' +
    '<div class="m-track" aria-hidden="true"><i style="width:' + Math.round(100 * pos / tot) + '%"></i></div>' +
    '<p class="m-sec">' + esc(cur.title) + '</p></div>' +
    '<h1 class="m-q" id="mq">' + esc(q.label) + '</h1>' + (q.hint ? '<p class="m-hint">' + esc(q.hint) + '</p>' : '') +
    body +
    (state.err ? '<p role="alert" class="alert">' + esc(state.err) + '</p>' : '') +
    '<div class="m-dots" aria-hidden="true">' + dots + '</div>' +
    '<p class="tiny">Your answers are used only to prepare your AI recommendations and are handled under the AI Dome privacy policy.</p>' +
    '<div class="m-bar"><button type="button" class="btn btn-ghost" data-act="back">Back</button>' +
    (last ? '<button type="button" class="btn btn-primary" data-act="submit">See my results</button>' : '<button type="button" class="btn btn-primary" data-act="next">' + (isAnswered(q) ? 'Next' : 'Skip') + '</button>') + '</div>' +
  '</section>';
}
function isAnswered(q) { var v = state.a[q.id]; return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }
function mNext() { var cur = STEPS[state.step - 1]; if (state.qi < cur.qs.length - 1) go(state.step, state.qi + 1); else go(state.step + 1, 0); }
function mBack() { if (state.qi > 0) go(state.step, state.qi - 1); else if (state.step > 1) go(state.step - 1, STEPS[state.step - 2].qs.length - 1); else go(0); }

function viewResults() {
  var r = results(), segs = '', on = Math.round(r.score / 10);
  for (var i = 0; i < 10; i++) segs += '<div class="seg' + (i < on ? ' on' : '') + '"></div>';
  return '<section>' +
    '<div><p class="eyebrow">Your AI starting point</p><h1 class="results">Thanks' + esc(r.greeting) + ' — here’s where we’d start.</h1>' +
    '<p class="soft">A summary based on your answers. An AI Dome specialist will be in touch within one business day to walk you through it.</p></div>' +
    '<div class="score-card"><div><div class="label-caps">AI readiness</div><div class="score">' + r.score + '<span>/100</span></div></div>' +
      '<div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px"><div class="level">' + esc(r.level) + '</div>' +
      '<div class="scoresegs" aria-hidden="true">' + segs + '</div><p class="soft" style="font-size:15.5px">' + esc(r.levelText) + '</p></div></div>' +
    '<div class="two"><div class="box accent"><div class="cap">Recommended package</div><h2 style="font-size:30px">' + esc(r.pkg) + '</h2><p class="soft" style="font-size:15.5px">' + esc(r.pkgDesc) + '</p></div>' +
      '<div class="box"><div class="cap">Training focus</div><h2 style="font-size:24px">' + esc(r.trainTitle) + '</h2><p class="soft" style="font-size:15.5px">' + esc(r.trainText) + '</p></div></div>' +
    '<div class="box"><h2 style="font-size:24px;margin-bottom:8px">Your first AI agents</h2><div class="agents">' +
      r.agents.map(function (g) { return '<div class="agent">' + BOT + '<strong>' + esc(g.name) + '</strong><span>' + esc(g.desc) + '</span></div>'; }).join('') + '</div></div>' +
    '<div class="box"><h2 style="font-size:24px;margin-bottom:4px">Governance &amp; security priorities</h2><ol class="pri">' +
      r.priorities.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></div>' +
    '<div class="cta"><div style="flex:1 1 360px;min-width:0"><h2 style="font-size:24px;margin-bottom:6px">Next step: your free discovery session</h2>' +
      '<p class="soft" style="font-size:15.5px">We’ll review your answers, run a shadow AI scan and map a 12-week plan with you. Payment plans are available through grenke.</p></div>' +
      '<div class="row" style="gap:12px"><a class="btn btn-primary" style="padding:14px 22px" href="' + PHONE_TEL + '">Call ' + PHONE + '</a><a class="btn btn-ghost" style="padding:14px 22px" href="' + WEBSITE_URL + '" data-link="website">Back to website</a></div></div>' +
    '<p class="tiny">This summary is a general starting point based on your answers, not formal advice. Your AI Dome specialist will confirm recommendations in your discovery session.</p>' +
  '</section>';
}

function render() {
  var s = state.step, app = document.getElementById('app');
  var m = isMobile(); document.body.classList.toggle('is-mobile', m); document.body.classList.toggle('in-q', m && s >= 1 && s <= STEPS.length);
  app.innerHTML = s === 0 ? viewIntro() : (s <= STEPS.length ? (m ? viewStepMobile(s) : viewStep(s)) : viewResults());
  document.querySelectorAll('[data-link="website"]').forEach(function (el) { el.setAttribute('href', WEBSITE_URL); });
}

/* ---------- Events ---------- */
document.getElementById('app').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'start') go(1);
  else if (act === 'next') { if (isMobile()) mNext(); else go(state.step + 1); }
  else if (act === 'back') { if (isMobile()) mBack(); else go(state.step - 1); }
  else if (act === 'submit') submit();
  else if (act === 'pick') {
    var k = b.getAttribute('data-q').split(':'), q = STEPS[+k[0] - 1].qs[+k[1]], o = q.opts[+b.getAttribute('data-o')];
    if (q.type === 'multi') toggle(q, o); else setA(q.id, state.a[q.id] === o ? '' : o);
    render();
    if (isMobile() && q.type === 'single' && state.a[q.id] === o && !(state.step === STEPS.length && +k[1] === STEPS[state.step - 1].qs.length - 1)) { setTimeout(mNext, 280); return; }
    var again = document.querySelector('[data-q="' + k.join(':') + '"][data-o="' + b.getAttribute('data-o') + '"]'); if (again) again.focus();
  }
});
document.getElementById('app').addEventListener('input', function (e) {
  var id = e.target.getAttribute('data-id'); if (id) setA(id, e.target.value);
});

if (MQ && MQ.addEventListener) MQ.addEventListener('change', function () { if (!VIEW) { state.qi = 0; render(); } });
render();
</script>
</body>
</html>
